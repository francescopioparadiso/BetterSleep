services:
  # --- Database Services ---
  postgresUser:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bettersleep
      PGDATA: /var/lib/postgresql/data
      TZ: "Europe/Rome"
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/init_catalog.sql:/docker-entrypoint-initdb.d/init_catalog.sql

  timeseries-mongo:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password_mongo
      TZ: "Europe/Rome"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mqtt-broker:
    image: eclipse-mosquitto:latest
    restart: always
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - mosquitto_config:/mosquitto/config
    environment:
      TZ: "Europe/Rome"

  # --- Application Services ---
  catalog:
    build:
      context: .
      dockerfile: catalog/dockerfile
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - timeseries-mongo
      - mqtt-broker
    environment:
      TZ: "Europe/Rome"
    volumes:
      - ./catalog:/service
      - ./common:/service/common

  user-service:
    build:
      context: .
      dockerfile: user_service/dockerfile
    restart: always
    ports:
      - "9095:9095"
    depends_on:
      - postgresUser
      - mqtt-broker
    environment:
      TZ: "Europe/Rome"
    volumes:
      - ./user_service:/service
      - ./common:/service/common

  sleep-cycle-manager:
    build:
      context: .
      dockerfile: sleep_cycle_manager/dockerfile
    restart: always
    ports:
      - "9092:9092"
    depends_on:
      - mqtt-broker
      - catalog
      - user-service
    environment:
      TZ: "Europe/Rome"
    volumes:
      - ./sleep_cycle_manager:/service
      - ./common:/service/common

  time-series:
    build:
      context: .
      dockerfile: time_series/dockerfile
    restart: always
    ports:
      - "9093:9093"
    depends_on:
      - timeseries-mongo
      - mqtt-broker
      - catalog
    environment:
      TZ: "Europe/Rome"
    volumes:
      - ./time_series:/service
      - ./common:/service/common

  bed-analytics:
    build:
      context: .
      dockerfile: bed_analytics/dockerfile
    restart: always
    ports:
      - "9097:9097"
    depends_on:
      - mqtt-broker
      - catalog
      - time-series
    environment:
      TZ: "Europe/Rome"
    volumes:
      - ./bed_analytics:/service
      - ./common:/service/common


volumes:
  postgres_data:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
  mosquitto_config:
