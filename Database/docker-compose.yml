services:
  # --- 1. PostgreSQL (For Catalog) ---
  catalog-postgres:
      image: postgres:latest
      container_name: bs_postgres
      restart: always
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: password
        POSTGRES_DB: bettersleep
        PGDATA: /var/lib/postgresql/data
        TZ: "Europe/Rome"
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./init_catalog.sql:/docker-entrypoint-initdb.d/init_catalog.sql
        - /etc/localtime:/etc/localtime:ro
        - /etc/timezone:/etc/timezone:ro

  # --- 2. MongoDB Time Series Data ---
  timeseries-mongo:
    image: mongo:latest
    container_name: bs_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password_mongo
      TZ: "Europe/Rome"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  bed-analytics:
    build:
      context: ..
      dockerfile: bed_analytics/dockerfile
    container_name: bs_bed_analytics
    restart: unless-stopped
    depends_on:
      - timeseries-mongo
    environment:
      BED_ANALYTICS_CATALOG_URL: http://host.docker.internal:8080
      BED_ANALYTICS_SKIP_CATALOG: "true"
      BED_ANALYTICS_MONGO_HOST: timeseries-mongo
      BED_ANALYTICS_MONGO_PORT: 27017
      BED_ANALYTICS_MONGO_DATABASE: sleepanalyticsdb
      BED_ANALYTICS_TIMESERIES_ENDPOINT: http://host.docker.internal:9093
      BED_ANALYTICS_USER_SERVICE_URL: http://host.docker.internal:9095
      BED_ANALYTICS_MQTT_BROKER: broker.hivemq.com
      BED_ANALYTICS_MQTT_PORT: 1883
    ports:
      - "9097:9097"


volumes:
  postgres_data:
  mongo_data:
